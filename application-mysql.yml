# Activate with: SPRING_PROFILES_ACTIVE=mysql
# Provides sane MySQL defaults; still override via env vars in real deployments.
spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/resource_booking?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: ${DB_DRIVER:com.mysql.cj.jdbc.Driver}
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
