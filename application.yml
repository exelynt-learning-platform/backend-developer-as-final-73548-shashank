server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: resource-booking-system

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/resource_booking}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: ${DB_DRIVER:org.postgresql.Driver}

  jpa:
    hibernate:
      # 'validate' in real prod once schema is stable; 'update' is convenient for local/dev + seed data
      ddl-auto: ${DDL_AUTO:update}
    show-sql: ${SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true
        dialect: ${HIBERNATE_DIALECT:org.hibernate.dialect.PostgreSQLDialect}
    open-in-view: false

  jackson:
    serialization:
      write-dates-as-timestamps: false

app:
  jwt:
    # Base64-encoded secret, must be >= 256 bits for HS256. Override in production via env var!
    secret: ${JWT_SECRET:MzhmNGI3N2M5ZDJlNDFhNGI4ZjkyM2E3ZDYxYzhlMmY5YjA3ZDNlNGE1YzZmN2E4YjljMGQxZTJmM2E0YjVjNmQ3ZTg=}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}   # 24 hours
  seed:
    enabled: ${SEED_ENABLED:true}
    admin:
      username: ${SEED_ADMIN_USERNAME:admin}
      password: ${SEED_ADMIN_PASSWORD:Admin@123}
      email: ${SEED_ADMIN_EMAIL:admin@bookingsystem.com}
    user:
      username: ${SEED_USER_USERNAME:john}
      password: ${SEED_USER_PASSWORD:User@123}
      email: ${SEED_USER_EMAIL:john@bookingsystem.com}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
  api-docs:
    path: /v3/api-docs

logging:
  level:
    com.booking.resourcebooking: ${LOG_LEVEL:INFO}
    org.springframework.security: ${SECURITY_LOG_LEVEL:WARN}
